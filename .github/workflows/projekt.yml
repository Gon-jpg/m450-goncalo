name: Projekt

on:
  push:
    paths:
      - '13-projekt/**'
      - '.github/workflows/projekt.yml'
  pull_request:
    paths:
      - '13-projekt/**'
      - '.github/workflows/projekt.yml'

defaults:
  run:
    working-directory: 13-projekt/recipe-planner/backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 13-projekt/recipe-planner/backend/pom.xml
      - name: Compile
        run: ./mvnw -B -DskipTests compile

  test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: 13-projekt/recipe-planner/backend/pom.xml
      - name: Run tests and build reports
        run: ./mvnw -B test org.apache.maven.plugins:maven-surefire-report-plugin:3.2.5:report-only
      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/13-projekt/**/surefire-reports/TEST-*.xml'
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: 13-projekt/recipe-planner/backend/target/site

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reports
          path: site
      - name: Add index page
        working-directory: site
        run: |
          cat > index.html <<HTML
          <!doctype html>
          <html lang="de"><head><meta charset="utf-8"><title>Recipe Planner Reports</title></head>
          <body style="font-family:sans-serif;max-width:40rem;margin:2rem auto">
          <h1>Recipe Planner Reports</h1>
          <p>Commit ${GITHUB_SHA::7}, Run <a href="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}">${GITHUB_RUN_ID}</a></p>
          <ul>
          <li><a href="surefire-report.html">Testresultate (Surefire)</a></li>
          <li><a href="jacoco/index.html">Code Coverage (JaCoCo)</a></li>
          </ul>
          </body></html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
